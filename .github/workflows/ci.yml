name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CACHIX_CACHE: smaug123

jobs:
  rust:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    # The proof harnesses need real hardware (macOS, Apple container, sudo, PF),
    # but the pure helpers they share do not, so their unit tests run here: plain
    # bash, no Nix, milliseconds. A misclassified proof failure is silent — it
    # does not fail a proof, it explains one wrongly — so this guards the
    # explanation, which is the part a human acts on. First step in the job
    # because it is the cheapest thing that can fail.
    - name: Run proof-helper unit tests
      run: |
        ./scripts/test-proof-helpers.sh

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ab0a9732c6464e5bb81efb82a2103c7d98f0946f
    - name: Enable Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@b8276522d77f21bf19d3574e5bc99186a6c7aa6c

    # rust-cache computes its key from `rustc -vV` and `Cargo.lock`, so the
    # devshell's toolchain has to be on PATH for the step itself. The cargo
    # invocations below still run under `nix develop` for the rest of the
    # shell's environment; this only lets the cache action see rustc.
    - name: Expose the devshell toolchain to later steps
      run: |
        nix develop --command sh -c 'printf "%s\n" "$PATH" | tr ":" "\n"' >> "$GITHUB_PATH"

    # Restores ~/.cargo (registry, git checkouts) and target/ from the last run
    # with the same Cargo.lock and toolchain. Without it every run compiles all
    # ~300 dependency crates from scratch for clippy and again for the test
    # profile. `cache-on-failure` saves the dependency build even when a later
    # step fails, so a red run still warms the next one.
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: true

    - name: Run clippy
      run: |
        nix develop --command cargo clippy --all-targets --all-features -- -D warnings

    # No separate `cargo build`: the test step builds everything it needs, and
    # the host binaries are covered by the Nix Build job.
    - name: Run tests
      run: |
        nix develop --command cargo test --verbose

    # The default (host) feature no longer enables vm-client, so `cargo test`
    # above does not compile the guest surface. Run its lib+bin tests directly;
    # the tests/ integration suites are host-only, hence --lib --bins.
    - name: Run guest-surface tests
      run: |
        nix develop --command cargo test -p writ --no-default-features --features vm-client --lib --bins --verbose

    - name: Run fmt
      run: |
        nix develop --command cargo fmt --check

    - name: Run cargo doc
      run: |
        nix develop --command env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ab0a9732c6464e5bb81efb82a2103c7d98f0946f
    - name: Enable Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@b8276522d77f21bf19d3574e5bc99186a6c7aa6c

    # With the token the action's post step pushes every store path this job
    # built, so the next run whose sources hash the same fetches the result
    # instead of rebuilding it. Without the token the cache was pull-only, and
    # nothing had ever been pushed for x86_64-linux, so every run rebuilt from
    # scratch.
    - name: Use Cachix
      uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      with:
        name: ${{ env.CACHIX_CACHE }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build Nix package
      run: |
        nix build .#packages.x86_64-linux.default --print-build-logs

  # The release-profile test run under Nix: `checks.tests` compiles the
  # workspace's test targets in the release profile against the cached
  # dependency artifacts and runs the whole suite in the sandbox. The PR path
  # already runs the suite in the dev profile (the Rust job above), so this
  # duplicate is worth its ~10 minutes only as a gate on what lands on `main`,
  # not on every push to a PR. Run it by hand with
  # `nix build .#checks.<system>.tests` or `nix flake check`.
  nix-tests:
    name: Nix release-profile tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ab0a9732c6464e5bb81efb82a2103c7d98f0946f
    - name: Enable Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@b8276522d77f21bf19d3574e5bc99186a6c7aa6c

    - name: Use Cachix
      uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      with:
        name: ${{ env.CACHIX_CACHE }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Run the test suite under Nix
      run: |
        nix build .#checks.x86_64-linux.tests --print-build-logs

  # The official agent-VM guest image, built for this runner's architecture,
  # then driven for real: the locked-profile initializer is started from the
  # image under exactly the locked capability profile, released with USR1 from
  # the host, and the released identity and tools are checked. The rootfs
  # invariants (no setuid/setgid, unwritable initializer) are asserted inside
  # the image derivation itself, so `nix build` succeeding is part of the
  # evidence. See docs/plans/2026-09-01-ipv4-only-locked-v1.md, stage B3.
  guest-image:
    name: Guest image handoff
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ab0a9732c6464e5bb81efb82a2103c7d98f0946f
    - name: Enable Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@b8276522d77f21bf19d3574e5bc99186a6c7aa6c

    # With the token the action's post step pushes every store path this job
    # built, so the next run whose sources hash the same fetches the result
    # instead of rebuilding it. Without the token the cache was pull-only, and
    # nothing had ever been pushed for x86_64-linux, so every run rebuilt from
    # scratch.
    - name: Use Cachix
      uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      with:
        name: ${{ env.CACHIX_CACHE }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build the guest image
      run: |
        nix build .#agent-vm-guest-image-x86_64-linux --print-build-logs --out-link guest-image.oci.tar

    - name: Load the image into Docker
      run: |
        nix run nixpkgs#skopeo -- copy oci-archive:guest-image.oci.tar docker-daemon:writ-agent-vm-guest:latest
        docker image inspect writ-agent-vm-guest:latest --format '{{json .Config.Labels}}'

    - name: Run the handoff against the image
      env:
        WRIT_GUEST_IMAGE_RUNTIME: docker
        WRIT_GUEST_IMAGE_REF: writ-agent-vm-guest:latest
      run: |
        nix develop --command cargo test -p writ-guest-init --test official_image_handoff -- --ignored --test-threads=1

  all-required-checks-complete:
    if: ${{ always() }}
    needs: [nix-build, rust, guest-image]
    runs-on: ubuntu-latest
    steps:
      - uses: G-Research/common-actions/check-required-lite@2b7dc49cb14f3344fbe6019c14a31165e258c059
        with:
          needs-context: ${{ toJSON(needs) }}
