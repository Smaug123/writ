[package]
name = "writ-core"
version = "0.1.0"
edition = "2024"

[features]
# The tokio-backed halves of `process_spawn` and `git_env` are the only
# host-only surface in this crate. The parent crate's `host` feature enables
# `writ-core/host`.
host = ["dep:tokio"]
# `test_support`: PATH lookup, shell quoting and executable test scripts,
# for downstream crates' tests. Never enabled by a production build.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
# `process_spawn` classifies spawn refusals by raw errno; `io::ErrorKind` has no
# stable variant for EMFILE/ENFILE, so the constants come from libc.
libc = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
tokio = { version = "1", features = ["process", "time"], optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
tempfile = "3"
