[package]
name = "writ-agent-run"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# Only the shared runtime bits need these; see the feature table below.
writ-core = { path = "../writ-core", optional = true }
ring = { version = "0.17", optional = true }

[features]
# Feature names mirror the root `writ` crate so the moved module's `#[cfg(...)]`
# attributes are unchanged. `vm-client` compiles the host/guest-shared runtime
# bits — sha256 hashing (ring) and the agent process runner
# (`writ_core::process_spawn`). `host` additionally compiles host-only helpers
# (`AgentPrompt::summary`), so it implies `vm-client`.
host = ["vm-client"]
vm-client = ["dep:ring", "dep:writ-core"]
# Exposes the test-only `AgentPrompt::new` convenience constructor to downstream
# test code (the root crate enables this as a dev-dependency feature).
test-support = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
serde_json = "1"
