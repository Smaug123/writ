[package]
name = "writ"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/writ-core", "crates/writ-vm-git", "crates/writ-agent-run", "crates/writ-vm-client", "crates/writ-audit", "crates/writ-guest-init", "crates/bailiff"]
# Without this, root-level `cargo clippy/test/doc` (as run by CI) select only
# the root `writ` package, silently skipping member crates' own test targets
# and rustdoc. Keep every member in the default gate set.
default-members = [".", "crates/writ-core", "crates/writ-vm-git", "crates/writ-agent-run", "crates/writ-vm-client", "crates/writ-audit", "crates/writ-guest-init", "crates/bailiff"]
resolver = "3"

[features]
default = ["host"]
# `host` does NOT enable `vm-client`: the broker never runs the guest HTTP
# client. It depends directly on what it actually uses — `reqwest` for its own
# outbound HTTP (GitHub minter, VM proxies) and `writ-vm-git` for the shared
# wire types.
host = [
    "writ-core/host",
    "writ-agent-run/host",
    "dep:writ-audit",
    "dep:base64",
    "dep:bytes",
    "dep:futures-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:jsonwebtoken",
    "dep:keyring",
    "dep:reqwest",
    "dep:ring",
    "dep:rusqlite",
    "dep:ssh-key",
    "dep:subtle",
    "dep:writ-guest-init",
    "dep:writ-vm-git",
    "dep:xz2",
    "dep:zstd",
]
# The guest client lives in the `writ-vm-client` crate; `writ`'s only
# vm-client code is the `writ-vm` binary, which uses the re-exports (agent_run
# runner, vm_git wire types) and depends on nothing else of its own.
# Exposes `writ::test_support` (in-memory secret store, PATH lookups, key
# fixtures) to downstream crates' tests; never enabled by a production build.
test-support = ["dep:tempfile", "writ-core/test-support"]
vm-client = ["dep:writ-vm-client", "writ-agent-run/vm-client", "dep:writ-vm-git"]

[[bin]]
name = "writ"
path = "src/bin/writ.rs"
required-features = ["host"]

[[bin]]
name = "writ-agent-vm-pf-helper"
path = "src/bin/writ-agent-vm-pf-helper.rs"
required-features = ["host"]

[[bin]]
name = "writ-agent-vm-runner"
path = "src/bin/writ-agent-vm-runner.rs"
required-features = ["host"]

[[bin]]
name = "writ-vm"
path = "src/bin/writ-vm.rs"
required-features = ["vm-client"]

[[bin]]
name = "writd"
path = "src/bin/writd.rs"
required-features = ["host"]

[dependencies]
# Optional so `test_support` (behind `test-support`) can hand out tempdirs; the
# dev-dependency below covers this crate's own `cfg(test)` builds.
tempfile = { version = "3", optional = true }
writ-core = { path = "crates/writ-core" }
# Non-optional: `agent_run` is re-exported as `writ::agent_run` in all builds.
# The runtime bits (runner, hashing) come from its host/vm-client features,
# enabled above.
writ-agent-run = { path = "crates/writ-agent-run" }
# The guest client, re-exported as `writ::vm_client` under the vm-client feature.
writ-vm-client = { path = "crates/writ-vm-client", optional = true }
# The audit log, re-exported as `writ::audit` under the host feature.
writ-audit = { path = "crates/writ-audit", optional = true }
writ-vm-git = { path = "crates/writ-vm-git", optional = true }
# The guest-side handoff, as data. The host reads its constants (the image's
# isolation-ABI label and version, the locked capability argv) when deciding
# whether a `ipv4_only_locked_v1` session may start, and will read its records
# when one does. Pure, so it costs a host build nothing but the compile.
writ-guest-init = { path = "crates/writ-guest-init", optional = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "linux-native"], optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "fs", "time", "sync", "io-util", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2", "stream"], optional = true }
jsonwebtoken = { version = "9", optional = true }
base64 = { version = "0.22", optional = true }
ring = { version = "0.17", optional = true }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "getrandom", "std"], optional = true }
subtle = { version = "2", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
xz2 = { version = "0.1", features = ["static"], optional = true }
zstd = { version = "0.13", optional = true }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
# `test-support` exposes `AgentPrompt::new` (a panicking test constructor) to
# this crate's tests, which use it in ~30 places across modules.
writ-agent-run = { path = "crates/writ-agent-run", features = ["test-support"] }
# `test-support` exposes audit's `*_for_test` DAO read-back helpers to writ's
# tests (vm_http proxy tests, git_push_approve tests).
writ-audit = { path = "crates/writ-audit", features = ["test-support"] }
writ-core = { path = "crates/writ-core", features = ["test-support"] }
